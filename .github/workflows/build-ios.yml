name: Build iOS App

on:
  workflow_dispatch: # Actions 탭에서 버튼 클릭으로 수동 실행
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14 # GitHub에서 제공하는 최신 Apple Silicon Mac

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Xcode Archive
        run: |
          if [ -d "Unity-iPhone.xcworkspace" ]; then
            TARGET="-workspace Unity-iPhone.xcworkspace"
          else
            TARGET="-project Unity-iPhone.xcodeproj"
          fi

          xcodebuild $TARGET \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Unity-iPhone.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/Unity-iPhone.xcarchive/Products/Applications/*.app Payload/
          zip -r Unity-iPhone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iPhone-IPA
          path: Unity-iPhone.ipa
